# Application Configuration
spring.application.name=acadpredict-backend
server.port=8081

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/acadpredict?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Python AI Prediction Service
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}

# React Frontend CORS Configuration
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# Security Configuration
app.jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtYXV0aGVudGljYXRpb24tc2VjdXJlLTMyLWJ5dGVzCg==}
app.jwt.expiration-ms=86400000

# Document Storage Configuration
app.document.storage-dir=${DOCUMENT_STORAGE_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Development Role Provisioning (disabled by default; enable via DEV_PROVISION_ACCOUNTS=true)
app.dev.provision-accounts=${DEV_PROVISION_ACCOUNTS:false}
app.dev.faculty-email=${DEV_FACULTY_EMAIL:faculty@college.edu}
app.dev.faculty-password=${DEV_FACULTY_PASSWORD:FacultyPass123!}
app.dev.faculty-name=${DEV_FACULTY_NAME:Dr. Sharma}
app.dev.coordinator-email=${DEV_COORDINATOR_EMAIL:coordinator@college.edu}
app.dev.coordinator-password=${DEV_COORDINATOR_PASSWORD:CoordinatorPass123!}
app.dev.coordinator-name=${DEV_COORDINATOR_NAME:Prof. Williams}

